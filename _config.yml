# Minimal Jekyll configuration for blog section
# Rest of site remains static HTML

# Site information
title: "C.M. Downey"
description: "Personal website and blog"
url: "https://cmdowney88.github.io"

# Build settings
markdown: kramdown
permalink: /blog/:year/:month/:day/:title/

# Local previewing only: keep bundler's vendored gems and the Gemfile out of
# the built site. GitHub Pages never sees these.
exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
